---
# =============================================================================
# LAYER 3 - ENVIRONMENT OVERRIDES: dev100 (lab)
# Only what makes THIS environment different from shared/base + tier (nonprod) + topology (single-site).
# Every shared layer is loaded before this file.
# =============================================================================

# ---- KRaft on three servers: a controller and a broker on every server ----------------------------
iac_kraft_colocated: true
# Control Center shares cp-node3 with a KRaft controller: its Alertmanager moves away from port 9093.
control_center_next_gen_dependency_alertmanager_port: 9195

# ---- Broker properties (merged key by key with base and tier) --------------------------------------
kafka_broker_custom_properties:
  # dev100 keeps data for 12 hours (tier nonprod: 72)
  log.retention.hours: 12
  # LAB: the directory is OpenLDAP, not Active Directory. Group membership comes from the groups
  # (groupOfNames/member) instead of the memberOf attribute of the user.
  ldap.search.mode: GROUPS
  ldap.user.name.attribute: uid
  ldap.user.object.class: inetOrgPerson
  ldap.user.search.filter: "(uid={0})"
  ldap.group.object.class: groupOfNames
  ldap.group.member.attribute: member
  ldap.group.member.attribute.pattern: "uid=(.*),ou=users,dc=lab,dc=local"
  
# ---- LAB: no identity provider, LDAP only (THY: shared/base) ----------------------------------------
auth_mode: ldap
iac_required_secrets:              # dictionary merge: false removes an entry of the baseline registry
  vault_oauth_superuser_client_secret: false
  vault_schema_registry_oauth_client_secret: false
  vault_kafka_connect_oauth_client_secret: false
  vault_kafka_rest_oauth_client_secret: false
  vault_control_center_oauth_client_secret: false
# cp-ansible reads these even with auth_mode ldap; upstream defaults, not used
oauth_superuser_client_password: none
schema_registry_oauth_password: password
kafka_connect_oauth_password: password
kafka_rest_oauth_password: password
control_center_next_gen_oauth_password: password
oauth_idp_cert_path: ""
# LAB: MDS super user of the lab directory (baseline: svc-kafka-mds)
mds_super_user: svc-kafka-broker

# ---- LAB: the file server on cp-node1 instead of Nexus ---------------------------------------------
iac_artifact_url: http://10.0.0.140:8888

# ---- LAB: 11.7 GB RAM per server (tier nonprod: broker -Xms3g -Xmx3g, Control Center -Xmx3g) --------
iac_kafka_broker_heap: "-Xms2g -Xmx2g"
iac_control_center_heap: "-Xmx2g"


iac_host_tls_dir: /etc/kafka/tls
iac_tls_stage_dir: /tmp/iac-tls
ssl_custom_certs: false
ssl_provided_keystore_and_truststore: true
ssl_provided_keystore_and_truststore_remote_src: false
ssl_keystore_filepath: "{{ iac_tls_stage_dir }}/{{ inventory_hostname }}/keystore.p12"
ssl_truststore_filepath: "{{ iac_tls_stage_dir }}/{{ inventory_hostname }}/truststore.p12"
ssl_keystore_store_password: "{{ ansible_env.IAC_SECRET_KAFKA_SSL_KEYSTORE_PASSWORD | default('') }}"
ssl_keystore_key_password: "{{ ansible_env.IAC_SECRET_KAFKA_SSL_KEYSTORE_PASSWORD | default('') }}"
ssl_truststore_password: "{{ ansible_env.IAC_SECRET_KAFKA_SSL_TRUSTSTORE_PASSWORD | default('') }}"
ssl_keystore_alias: "{{ inventory_hostname }}"
ssl_truststore_ca_cert_alias: lab-root-ca
