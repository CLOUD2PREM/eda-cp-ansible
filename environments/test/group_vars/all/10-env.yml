---
# =============================================================================
# LAYER 3 - ENVIRONMENT IDENTITY: test
# Values that identify the environment and its endpoints. TODO: replace example values.
# =============================================================================
iac_env: test

# Cluster names (RBAC cluster registry, Control Center)
kafka_broker_cluster_name: cp-test
schema_registry_cluster_name: cp-test-schema-registry
kafka_connect_cluster_name: cp-test-connect
kafka_connect_group_id: cp-test-connect

# Directory services (Active Directory, LDAPS)
iac_ldap_url: ldap://cp-node1.lab.local:1389
iac_ldap_bind_dn: "cn=ldap-bind-user,dc=lab,dc=local"
iac_ldap_user_search_base: "ou=users,dc=lab,dc=local"
iac_ldap_group_search_base: "ou=groups,dc=lab,dc=local"

# Identity provider (OAuth). Client secrets come from IAC_SECRET_* variables (secrets.env.example).
iac_oauth_base_url: https://sso.lab.local/oauth2
iac_oauth_expected_audience: kafka-test
iac_oauth_client_ids:
  superuser: kafka-test-superuser
  schema_registry: kafka-test-schema-registry
  kafka_connect: kafka-test-connect
  kafka_rest: kafka-test-rest-proxy
  control_center: kafka-test-control-center
