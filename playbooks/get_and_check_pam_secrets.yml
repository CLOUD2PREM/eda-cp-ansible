- name: Set up LDAP secrets 
  ansible.builtin.import_playbook: pam.yml

- name: Check LDAP secrets
  hosts: all
  gather_facts: false
  tags: always

  tasks:
    - name: Check whether the file exists
      ansible.builtin.stat:
        path: "{{ env_config_file }}"
      register: client_config_stat

    - name: Validate that the file exists and is a regular file
      ansible.builtin.assert:
        that:
          - client_config_stat.stat.exists
          - client_config_stat.stat.isreg
        fail_msg: >-
          {{ env_config_file }} does not exist or is not a regular
          file on {{ inventory_hostname }}.

    - name: Read file contents
      ansible.builtin.slurp:
        src: "{{ env_config_file }}"
      register: client_config_content
      no_log: true

    - name: Store file lines
      ansible.builtin.set_fact:
        client_config_lines: >-
          {{ (client_config_content.content | b64decode).splitlines() }}
      no_log: true

    - name: Validate that the file is not empty
      ansible.builtin.assert:
        that:
          - client_config_lines | length > 0
        fail_msg: "File {{ env_config_file }} is empty on {{ inventory_hostname }}"

    - name: Validate line format
      ansible.builtin.assert:
        that:
          - item is match('^IAC_SECRET_[^=]+=.*$')
        fail_msg: >-
          Invalid line in {{ env_config_file }} on {{ inventory_hostname }}.
          Each line must start with IAC_SECRET_ and contain an = separator.
      loop: "{{ client_config_lines }}"
      loop_control:
        label: "{{ item.split('=')[0] if '=' in item else 'invalid-line' }}"
      no_log: true

