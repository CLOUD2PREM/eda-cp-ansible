---
# Diagnostic bundle (configuration, logs, system information) of an environment.
# This file is REQUIRED next to the other wrappers: the confluent.platform.support_bundle_on_failure
# callback runs "support_bundle.yml" from the directory of the playbook that failed.
# No preflight on purpose: it must work on a broken environment.
#   scripts/run.sh <environment> support_bundle
- name: Confluent support bundle
  ansible.builtin.import_playbook: confluent.platform.support_bundle

- name: Post-process and copy support bundle
  hosts: localhost
  connection: local
  gather_facts: false
  become: false 
  tasks:
    - name: Get archive file stats
      become: false
      ansible.builtin.stat:
        path: "{{ (support_bundle_output_path | regex_replace('/$', '')) }}/{{ hostvars['localhost']['bundle_name'] }}.tar.gz"
      register: bundle_archive_stats

- name: Post-process and copy support bundle
  hosts: control_center_next_gen
  tasks:
    - name: Copy archive to target host
      ansible.builtin.copy:
        src: "{{ (support_bundle_output_path | regex_replace('/$', '')) }}/{{ hostvars['localhost']['bundle_name'] }}.tar.gz"
        dest: "/tmp/{{ hostvars['localhost']['bundle_name'] }}.tar.gz"
        mode: "0644"
      when: "{{ hostvars['localhost']['bundle_archive_stats']['stat']['exists'] }}"
