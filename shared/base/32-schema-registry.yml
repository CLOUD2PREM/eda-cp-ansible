---
# LAYER 1 - Schema Registry
iac_schema_registry_heap: "-Xms1g -Xmx1g"

schema_registry_service_environment_overrides:
  SCHEMA_REGISTRY_HEAP_OPTS: "{{ iac_schema_registry_heap }} {{ iac_jvm_g1_opts }}"

schema_registry_custom_properties:
  schema.compatibility.level: backward      # TODO(OD-10): schema governance decision
  schema_registry_custom_properties:
  config.providers: env
  config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  config.providers.env.param.allowlist.pattern: '^IAC_SECRET_.*'
  confluent.metadata.basic.auth.user.info: "{{ schema_registry_ldap_user }}:${env:IAC_SECRET_SCHEMA_REGISTRY_LDAP_PASSWORD}"


schema_registry_service_overrides:
  EnvironmentFile: /opt/confluent/kafka.env


