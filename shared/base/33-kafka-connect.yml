---
# LAYER 1 - Kafka Connect
iac_kafka_connect_heap: "-Xms1g -Xmx2g"
iac_kafka_connect_token_jaas: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required username="{{ kafka_connect_ldap_user }}" password="${env:IAC_SECRET_KAFKA_CONNECT_LDAP_PASSWORD}" metadataServerUrls="{{ mds_bootstrap_server_urls }}";'

kafka_connect_service_environment_overrides:
  KAFKA_HEAP_OPTS: "{{ iac_kafka_connect_heap }}"
# Converter credentials: with RBAC, Schema Registry rejects anonymous requests, but cp-ansible only writes the
# converters' URL and TLS settings. Without these lines every Avro/Protobuf/JSON Schema task fails with 401
# while the connector itself still reports RUNNING. The values are moved out of the file (config_secrets.yml).
kafka_connect_custom_properties:
  config.storage.replication.factor: 3
  offset.storage.replication.factor: 3
  status.storage.replication.factor: 3
  key.converter.basic.auth.credentials.source: USER_INFO
  value.converter.basic.auth.credentials.source: USER_INFO
  config.providers: "secret,env"
  config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  config.providers.env.param.allowlist.pattern: '^IAC_SECRET_.*'
  confluent.metadata.basic.auth.user.info: "{{ kafka_connect_ldap_user }}:${env:IAC_SECRET_KAFKA_CONNECT_LDAP_PASSWORD}"
  key.converter.schema.registry.basic.auth.user.info: "{{ kafka_connect_ldap_user }}:${env:IAC_SECRET_KAFKA_CONNECT_LDAP_PASSWORD}"
  value.converter.schema.registry.basic.auth.user.info: "{{ kafka_connect_ldap_user }}:${env:IAC_SECRET_KAFKA_CONNECT_LDAP_PASSWORD}"
  sasl.jaas.config: "{{ iac_kafka_connect_token_jaas }}"
  producer.sasl.jaas.config: "{{ iac_kafka_connect_token_jaas }}"
  consumer.sasl.jaas.config: "{{ iac_kafka_connect_token_jaas }}"
  producer.confluent.monitoring.interceptor.sasl.jaas.config: "{{ iac_kafka_connect_token_jaas }}"
  consumer.confluent.monitoring.interceptor.sasl.jaas.config: "{{ iac_kafka_connect_token_jaas }}"
  config.providers.secret.param.kafkastore.sasl.jaas.config: "{{ iac_kafka_connect_token_jaas }}"


kafka_connect_service_overrides:
  EnvironmentFile: /opt/confluent/kafka.env